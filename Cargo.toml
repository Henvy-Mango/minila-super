[package]
name = "minila-super-rmk"
version = "0.1.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "minila-super-rmk"

[features]
default = ["mpr121"]
mpr121 = []

[dependencies]
rmk = { version = "0.9", features = ["rp2040"] }
# enable usb_log for debugging
# rmk = { version = "0.9", default-features = false, features = [
#     "rp2040", "storage", "vial", "host_lock", "watchdog", "usb_log",
# ] }
# log = { version = "0.4", features = ["max_level_info"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-sync = "0.8"
embedded-hal-async = "1"
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "defmt",
    "time-driver",
    "critical-section-impl",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
cortex-m-rt = "0.7.5"
portable-atomic = { version = "1", features = ["critical-section"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "minila-super-rmk"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
